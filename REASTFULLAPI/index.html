<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Servis Laptop & Komputer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container my-5">
        <h2 class="text-center mb-4 text-primary fw-bold">🛠️ Toko Servis Laptop & Komputer</h2>

        <div id="login-page" class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4">
                    <h4 class="text-center mb-3">Silakan Login</h4>
                    <div id="login-alert" class="alert alert-danger hidden"></div>
                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="login-email" class="form-control" required placeholder="fullapi@gmail.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="login-password" class="form-control" required placeholder="******">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Masuk & Dapatkan Token</button>
                    </form>
                </div>
            </div>
        </div>

        <div id="dashboard-page" class="row hidden">
            <div class="col-md-4 mb-4">
                <div class="card p-4">
                    <h4 class="mb-3">Tambah Antrean Servis</h4>
                    <form id="servis-form">
                        <div class="mb-3">
                            <label class="form-label">Nama Pelanggan</label>
                            <input type="text" id="nama_pelanggan" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Jenis Perangkat</label>
                            <input type="text" id="jenis_perangkat" class="form-control" placeholder="Contoh: Laptop ASUS ROG" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Keluhan / Kerusakan</label>
                            <textarea id="keluhan" class="form-control" rows="3" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Simpan Data</button>
                    </form>
                    <hr>
                    <button id="logout-btn" class="btn btn-danger btn-sm w-100">Keluar / Keluar Token</button>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4>Daftar Antrean Servis Aktif</h4>
                        <button onclick="loadDataServis()" class="btn btn-outline-primary btn-sm">🔄 Refresh Data</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-striped align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Nama</th>
                                    <th>Perangkat</th>
                                    <th>Keluhan</th>
                                </tr>
                            </thead>
                            <tbody id="tabel-servis-body">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        // Cek Apakah di browser sudah ada token tersimpan
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("access_token");
            if (token) {
                showDashboard();
            }
        });

        // Alur Proses Login
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;
            const alertBox = document.getElementById("login-alert");

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    // Simpan token JWT ke memori browser
                    localStorage.setItem("access_token", result.access_token);
                    alertBox.classList.add("hidden");
                    showDashboard();
                } else {
                    alertBox.textContent = "Login Gagal! Periksa email/password.";
                    alertBox.classList.remove("hidden");
                }
            } catch (error) {
                alertBox.textContent = "Tidak dapat tersambung ke server FastAPI.";
                alertBox.classList.remove("hidden");
            }
        });

        // Fungsi Menampilkan Dashboard & Mengambil Data
        function showDashboard() {
            document.getElementById("login-page").classList.add("hidden");
            document.getElementById("dashboard-page").classList.remove("hidden");
            loadDataServis();
        }

        // Fungsi Mengambil Data dari Backend (Membawa Token)
        async function loadDataServis() {
            const token = localStorage.getItem("access_token");
            const tbody = document.getElementById("tabel-servis-body");
            tbody.innerHTML = `<tr><td colspan="3" class="text-center">Memuat data...</td></tr>`;

            try {
                const response = await fetch(`${API_URL}/servis`, {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${token}` } // Mengirim token di header
                });

                if (response.status === 401) {
                    alert("Sesi habis atau token tidak valid. Silakan login kembali.");
                    logout();
                    return;
                }

                const data = await response.json();
                tbody.innerHTML = "";

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted">Belum ada antrean servis.</td></tr>`;
                    return;
                }

                data.forEach(item => {
                    const row = `<tr>
                        <td class="fw-bold">${item.nama_pelanggan}</td>
                        <td><span class="badge bg-secondary">${item.jenis_perangkat}</span></td>
                        <td>${item.keluhan}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-danger">Gagal mengambil data dari server.</td></tr>`;
            }
        }

        // Fungsi Tambah Data Servis Baru (Membawa Token)
        document.getElementById("servis-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const token = localStorage.getItem("access_token");
            const nama_pelanggan = document.getElementById("nama_pelanggan").value;
            const jenis_perangkat = document.getElementById("jenis_perangkat").value;
            const keluhan = document.getElementById("keluhan").value;

            try {
                const response = await fetch(`${API_URL}/servis`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}` // Mengirim token di header
                    },
                    body: JSON.stringify({ nama_pelanggan, jenis_perangkat, keluhan })
                });

                if (response.ok) {
                    alert("Data servis berhasil ditambahkan!");
                    document.getElementById("servis-form").reset();
                    loadDataServis(); // Refresh tabel biar data baru langsung muncul
                } else {
                    alert("Gagal menambah data!");
                }
            } catch (error) {
                alert("Terjadi kesalahan jaringan.");
            }
        });

        // Fungsi Logout (Hapus Token)
        document.getElementById("logout-btn").addEventListener("click", logout);

        function logout() {
            localStorage.removeItem("access_token"); // Hapus token dari browser
            document.getElementById("login-page").classList.remove("hidden");
            document.getElementById("dashboard-page").classList.add("hidden");
            document.getElementById("login-form").reset();
        }
    </script>
</body>
</html>
